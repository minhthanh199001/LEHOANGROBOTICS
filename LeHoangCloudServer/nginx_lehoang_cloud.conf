# ================================================================
# NGINX REVERSE PROXY CONFIGURATION FOR LE HOANG CLOUD SERVER
# Hỗ trợ đầy đủ Web Dashboard, REST API & WebSocket / SignalR Hub
# ================================================================

# 1. HTTP Redirect to HTTPS
server {
    listen 80;
    server_name cloud.lehoangrobotics.vn; # Thay bằng tên miền của bạn

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Server with SSL & WebSocket
server {
    listen 443 ssl http2;
    server_name cloud.lehoangrobotics.vn; # Thay bằng tên miền của bạn

    # SSL Certificates (Tạo tự động bằng Certbot)
    ssl_certificate /etc/letsencrypt/live/cloud.lehoangrobotics.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cloud.lehoangrobotics.vn/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Proxy tới ASP.NET Core Cloud Server (Cổng 5050)
    location / {
        proxy_pass http://127.0.0.1:5050;
        proxy_http_version 1.1;

        # Cấu hình bắt buộc cho SignalR WebSockets (fleetHub)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        # Chuyển tiếp thông tin client
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout dài cho WebSocket duy trì kết nối liên tục với robot
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
