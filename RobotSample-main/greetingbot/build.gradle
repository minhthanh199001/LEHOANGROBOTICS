apply plugin: 'com.android.application'

// A short local output path avoids Windows/SMB path limits when the source is on a mapped drive.
if (project.hasProperty('greetingBuildDir')) buildDir = file(project.property('greetingBuildDir'))

android {
    compileSdkVersion 29
    buildToolsVersion '30.0.3'
    defaultConfig {
        applicationId 'com.lehoangrobotics.greetingbot'
        minSdkVersion 23
        targetSdkVersion 29
        versionCode 8
        versionName '1.3.4'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation files('../app/libs/robotservice.jar')
    // RobotService uses Gson internally, including its authorization handshake.
    implementation 'com.google.code.gson:gson:2.7'
    testImplementation 'junit:junit:4.13.2'
}
